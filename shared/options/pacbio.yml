---
# options that set the path to the input PacBio strand-specific files for final basecalling
options:
    hifi-bam-file: 
        order: 1
        short: H
        type: string
        required: true
        default: null
        description: "path to a sample PacBio BAM file with hifi reads called by-strand"
    fail-bam-file: 
        order: 2
        short: F
        type: string
        required: true
        default: null
        description: "path to a sample PacBio BAM file with fail reads called by-strand"
