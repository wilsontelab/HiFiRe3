---
pipeline:
    name: analyze
    description: "Align reads, match inserts to RE fragments, and find true mosaic variants"
    version: v0.0.1
actions:
    _global:
        environment: hf3Main
        condaFamilies:
            - base
            - main
        optionFamilies:
            - library-properties
            - genome
            - restriction-enzyme
    fragments:
        order: 1
        optionFamilies:
            - read-file
            - alignment
            - localization
            - targets
        resources:
            required:
                total-ram: 64G
            recommended: 
                n-cpu: 16
                ram-per-cpu: 6G
        job-manager:
            recommended:
                time-limit: 24:00:00
        description: "align reads to genome, match to RE sites, apply quality filters, scan for chimeras"
    SVs:
        order: 2
        optionFamilies:
            - localization
            - targets
            - SV
        resources:
            required:
                total-ram: 24G
            recommended: 
                n-cpu: 8 # fragment indexing, the slowest step, is parallelized by chromosome
                ram-per-cpu: 6G
        job-manager:
            recommended:
                time-limit: 12:00:00
        description: "parse prepared fragments to describe and count unique SV and non-SV paths"
    SNVs:
        order: 3
        optionFamilies:
            - targets
            - SNV
            - pacbio
        resources:
            required:
                total-ram: 12G
            recommended: 
                n-cpu: 12
                ram-per-cpu: 4G
        job-manager:
            recommended:
                time-limit: 12:00:00
        description: "parse prepared PacBio by-strand reads to describe and count unique SNV combinations"
package:
    SVs: # the pipeline action after which a data package should assembled
        uploadType: hf3AnalyzeSVs # a signal to the Stage 2 framework regarding the package contents
        files:
            samplesFile:
                type: txt
                file: $SV_SAMPLES_FILE
            chromsFile:
                type: txt
                file: $ANALYSIS_CHROMS_FILE
            targetsBed:
                type: bed
                file: $TARGETS_BED
            genesBed:
                type: bed
                file: $GENES_BED
            exclusionsBed:
                type: bed
                file: $GENOME_EXCLUSIONS_BED
            filteringSitesBgz:
                type: txt.bgz
                file: $FILTERING_SITES_FILE
            filteringSitesTbi:
                type: txt.bgz.tbi
                file: $FILTERING_SITES_FILE.tbi
            filteredInsertSizes:
                type: txt
                file: $FILTERED_INSERT_SIZES_FILE
            filteredStemLengths:
                type: txt
                file: $FILTERED_STEM_LENGTHS_FILE
            svAlignmentsBgz:
                type: txt.bgz
                file: $SV_ALIGNMENTS_FILE
                maxSize: 250M
            svAlignmentsTbi:
                type: txt.bgz.tbi
                file: $SV_ALIGNMENTS_FILE.tbi
                maxSize: 250M
            svCoverageBgz:
                type: txt.bgz
                file: $SV_COVERAGE_FILE
                maxSize: 250M
            svCoverageTbi:
                type: txt.bgz.tbi
                file: $SV_COVERAGE_FILE.tbi
                maxSize: 250M
            svReadPaths:
                type: txt.bgz
                file: $SV_READ_PATHS_FILE
                maxSize: 250M
            svReadPathsTbi:
                type: txt.bgz.tbi
                file: $SV_READ_PATHS_FILE.tbi
                maxSize: 250M
            svJunctions1Bgz:
                type: txt.bgz
                file: $SV_FINAL_JUNCTIONS_FILE_1
            svJunctions1Tbi:
                type: txt.bgz.tbi
                file: $SV_FINAL_JUNCTIONS_FILE_1.tbi
            svJunctions2Bgz:
                type: txt.bgz
                file: $SV_FINAL_JUNCTIONS_FILE_2
            svJunctions2Tbi:
                type: txt.bgz.tbi
                file: $SV_FINAL_JUNCTIONS_FILE_2.tbi
            # genomeTally:
            #     type: txt
            #     file: $GENOME_TALLY_FILE
            # junctionTally:
            #     type: txt
            #     file: $JUNCTION_TALLY_FILE
    SNVs:
        uploadType: hf3AnalyzeSNVs
        files:
            samplesFile:
                type: txt
                file: $SNV_SAMPLES_FILE
            chromsFile:
                type: txt
                file: $ANALYSIS_CHROMS_FILE
            targetsBed:
                type: bed
                file: $TARGETS_BED
            exclusionsBed:
                type: bed
                file: $GENOME_EXCLUSIONS_BED
            variantsBgz:
                type: txt.bgz
                file: $SNV_VARIANTS_BGZ
            variantsTbi:
                type: txt.bgz.tbi
                file: $SNV_VARIANTS_BGZ.tbi
            variantReadsBgz:
                type: txt.bgz
                file: $SNV_VARIANT_READS_BGZ
            variantReadsTbi:
                type: txt.bgz.tbi
                file: $SNV_VARIANT_READS_BGZ.tbi
            fragmentsOnReferenceBgz:
                type: bed.bgz
                file: $SNV_FRAGMENTS_ON_REFERENCE_BGZ
            fragmentsOnReferenceTbi:
                type: bed.bgz.tbi
                file: $SNV_FRAGMENTS_ON_REFERENCE_BGZ.tbi
            fragmentsOnHaplotypeBgz:
                type: bed.bgz
                file: $SNV_FRAGMENTS_ON_HAPLOTYPE_BGZ
            fragmentsOnHaplotypeTbi:
                type: bed.bgz.tbi
                file: $SNV_FRAGMENTS_ON_HAPLOTYPE_BGZ.tbi
